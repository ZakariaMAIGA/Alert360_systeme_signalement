
spring.application.name=backend360
server.port=${PORT:8080}
server.address=0.0.0.0

# Configuration des fichiers multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Base de données PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs de sécurité
logging.level.org.springframework.security=INFO
logging.level.com.alert360.security=INFO

# Configuration JWT
alert360.app.jwtSecret=${JWT_SECRET}
alert360.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Stockage des médias Alert360
alert360.media.storage-dir=uploads/alert360
alert360.media.base-url=${ALERT360_MEDIA_BASE_URL:http://localhost:8080}



