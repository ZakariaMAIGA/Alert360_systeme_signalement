spring.application.name=backend360
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.datasource.url= jdbc:postgresql://localhost:5432/alert360
spring.datasource.username = postgres
spring.datasource.password=12345678

spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


logging.level.org.springframework.security=DEBUG

alert360.app.jwtSecret=Alert360SuperSecretKeyForJWTTokenGeneration2026WithHS256BitEncoding
alert360.app.jwtExpirationMs=86400000