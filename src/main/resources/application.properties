```properties
spring.application.name=backend360
server.port=8080

# Configuration des fichiers multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alert360
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs de sécurité
logging.level.org.springframework.security=DEBUG

# Configuration JWT
alert360.app.jwtSecret=Alert360SuperSecretKeyForJWTTokenGeneration2026WithHS256BitEncoding
alert360.app.jwtExpirationMs=86400000

# Stockage des médias Alert360
alert360.media.storage-dir=uploads/alert360
alert360.media.base-url=http://localhost:8080
```